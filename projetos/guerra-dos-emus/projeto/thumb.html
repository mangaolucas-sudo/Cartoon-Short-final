<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="2560" height="1440"></canvas>
<script type="module">
import * as T from './toon.js';
import { redDirt, wheatSide } from './paint2.js';
const W = 2560, H = 1440, c = document.getElementById('c'), g = c.getContext('2d');
await document.fonts.load('900 100px "Inter Display Black"').catch(() => {});
const HOR = 860;
// ---------- sky + sunburst ----------
let gr = g.createLinearGradient(0, 0, 0, HOR);
gr.addColorStop(0, '#3f9be0'); gr.addColorStop(0.7, '#8fcdf2'); gr.addColorStop(1, '#d9eef7');
g.fillStyle = gr; g.fillRect(0, 0, W, HOR);
const SX = 1900, SY = 430;
g.save(); g.globalAlpha = 0.16; g.fillStyle = '#ffffff';
for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; g.beginPath(); g.moveTo(SX, SY); g.arc(SX, SY, 2600, a, a + Math.PI / 36); g.fill(); }
g.restore();
const rg = g.createRadialGradient(SX, SY, 50, SX, SY, 900); rg.addColorStop(0, 'rgba(255,245,200,.75)'); rg.addColorStop(1, 'rgba(255,245,200,0)');
g.fillStyle = rg; g.fillRect(0, 0, W, HOR);
// clouds
const cloud = (x, y, s) => { const p = new T.Pen(g); for (const [dx, dy, r] of [[0, 0, 70], [80, -30, 90], [170, 0, 70], [90, 20, 80]]) p.ell(x + dx * s, y + dy * s, r * s, r * 0.75 * s, '#ffffff', 0); };
cloud(1250, 140, 1.1); cloud(2080, 90, 0.8);
// mesas
const P0 = new T.Pen(g); P0.ol = 8;
const mesa = (x0, x1, top, col) => P0.poly([[x0, HOR + 10], [x0 + 70, top + 20], [x0 + 110, top], [x1 - 110, top], [x1 - 60, top + 25], [x1, HOR + 10]], col, 7);
mesa(-60, 700, 640, '#d99a8a'); mesa(1500, 2700, 600, '#cf8e7e'); mesa(820, 1420, 720, '#e2aa96');
// gum trees on horizon
const tree = (x, s) => { P0.line([[x, HOR + 5], [x + 6 * s, HOR - 80 * s]], '#e8e2d4', 9 * s); P0.ell(x + 6 * s, HOR - 95 * s, 55 * s, 26 * s, '#6f9a52', 6); };
[[120, 1], [420, .8], [760, 1.1], [1080, .7], [1460, .9], [2050, .8], [2400, 1]].forEach(([x, s]) => tree(x, s));
// wheat band
const ws = g.createPattern(wheatSide(), 'repeat'); g.save(); g.translate(0, HOR - 40); g.fillStyle = ws; g.scale(1, 1.1); g.fillRect(0, 0, W, 120); g.restore();
// red dirt
const rd = g.createPattern(redDirt(), 'repeat'); g.fillStyle = rd; g.fillRect(0, HOR + 85, W, H - HOR);
gr = g.createLinearGradient(0, HOR + 85, 0, H); gr.addColorStop(0, 'rgba(255,200,150,.25)'); gr.addColorStop(1, 'rgba(90,30,10,.35)');
g.fillStyle = gr; g.fillRect(0, HOR + 85, W, H - HOR);
// fence
for (let x = 40; x < W; x += 260) P0.poly([[x, HOR + 150], [x + 14, HOR + 150], [x + 14, HOR + 30], [x, HOR + 30]], '#7a5434', 5);
P0.stroke([[0, HOR + 60], [W, HOR + 60]], 4, '#5a3a24'); P0.stroke([[0, HOR + 105], [W, HOR + 105]], 4, '#5a3a24');
// small emus running in the background
const small = (x, y, s, ph, flip) => { g.save(); g.translate(x, y); g.scale(flip ? -s : s, s); T.emu(new T.Pen(g), { mode: 'run', phase: ph }); g.restore(); };
small(330, 700, 0.30, 0.1, 1); small(560, 745, 0.24, 0.55, 1); small(1520, 750, 0.2, 0.3, 1);
// shadows
const shadow = (x, y, rx, ry) => { g.fillStyle = 'rgba(60,20,10,.35)'; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); };
// ---------- big emu (right, facing left) ----------

g.save(); g.translate(2870, 85); g.scale(-1.55, 1.55);
T.emu(new T.Pen(g), { mode: 'stand', expr: 'smug', medal: true });
g.restore();
// ---------- soldier (centre-left, shocked) ----------

g.save(); g.translate(700, 250); g.scale(1.4, 1.4);
T.person(new T.Pen(g), 'gunner', { expr: 'shock', L: 'hang', R: 'hold', prop: 'rifle', sweat: true });
g.restore();
// exclamation over soldier
g.save(); g.translate(1000, 140); g.scale(0.42, 0.42); T.fxExclaim(new T.Pen(g), 0.5); g.restore();
// ---------- title ----------
const text = (s, x, y, size, fill, { stroke = 26, rot = 0, align = 'left' } = {}) => {
  g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px "Inter Display Black", "Inter", Arial`; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.lineJoin = 'round'; g.fillStyle = 'rgba(30,15,20,.55)'; g.fillText(s, 10, 14);
  g.lineWidth = stroke; g.strokeStyle = '#241726'; g.strokeText(s, 0, 0); g.fillStyle = fill; g.fillText(s, 0, 0); g.restore();
};
text('EXÉRCITO', 80, 230, 215, '#ffffff', { rot: -0.03 });
text('x', 90, 450, 190, '#ffffff', { rot: -0.03 });
text('EMUS', 260, 460, 250, '#ffd23f', { rot: -0.03 });
// banner bottom-left
g.save(); g.translate(60, 1135); g.rotate(-0.035);
const P = new T.Pen(g); P.poly([[0, 0], [780, 0], [840, 130], [780, 260], [0, 260]], '#e2412f', 12);
g.restore();
text('QUEM', 110, 1250, 110, '#ffffff', { stroke: 18, rot: -0.035 });
text('VENCEU?', 110, 1365, 125, '#ffd23f', { stroke: 18, rot: -0.035 });
// year tag near emu
g.save(); g.translate(2370, 330); g.rotate(0.06); P.poly([[-150, -70], [150, -70], [150, 70], [-150, 70]], '#f4efe0', 10); g.restore();
text('1932', 2370, 370, 110, '#241726', { stroke: 0, rot: 0.06, align: 'center' });
window.done = 1;
</script></body></html>
